<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		%sveltekit.head%
		<style>
			#premium-app-loader {
				position: fixed;
				inset: 0;
				z-index: 999999;
				background-color: #F8F7F5;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.5s, transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
			}
			.loader-brand {
				display: flex;
				align-items: center;
				gap: 12px;
				animation: pulse-soft 2s infinite ease-in-out;
			}
			.loader-spinner {
				width: 28px;
				height: 28px;
				border: 3px solid rgba(255, 117, 31, 0.2);
				border-top-color: #FF751F;
				border-radius: 50%;
				animation: loader-spin 0.75s linear infinite;
			}
			.loader-text {
				font-family: 'Inter', sans-serif;
				font-size: 18px;
				font-weight: 800;
				color: #26252E;
				letter-spacing: -0.02em;
			}
			.loader-text span {
				color: #FF751F;
			}
			@keyframes loader-spin {
				0% { transform: rotate(0deg); }
				100% { transform: rotate(360deg); }
			}
			@keyframes pulse-soft {
				0%, 100% { opacity: 1; transform: scale(1); }
				50% { opacity: 0.7; transform: scale(0.98); }
			}
			/* The class we add when Svelte is ready */
			#premium-app-loader.loaded {
				opacity: 0;
				visibility: hidden;
				transform: scale(1.05);
				pointer-events: none;
			}
		</style>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="premium-app-loader">
			<div class="loader-brand">
				<div class="loader-spinner"></div>
				<div class="loader-text">HIMA <span>FST</span></div>
			</div>
		</div>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
